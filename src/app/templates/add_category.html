{% extends "base.html" %}

{% block title %}Add Category - Personal Finance Tracker{% endblock %}

{% block content %}
<a href="{{ url_for('category.categories') }}" class="back-link">← Back to Categories</a>

<div class="card" style="max-width: 500px;">
    <div class="card-header">
        <h2>Add New Category</h2>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('category.add_category') }}">
            <div class="form-group">
                <label class="form-label">Category Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g., Groceries, Salary" required>
            </div>

            <div class="form-group">
                <label class="form-label">Type</label>
                <select name="category_type" class="form-control" required>
                    <option value="">Select Type</option>
                    <option value="Income">Income</option>
                    <option value="Expense">Expense</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Color</label>
                <input type="color" name="color" class="form-control" value="#3498db" style="height: 40px; padding: 4px;">
                <span class="form-text">Choose a color to identify this category</span>
            </div>

            <div class="btn-group mt-3">
                <button type="submit" class="btn btn-primary">Create Category</button>
                <a href="{{ url_for('category.categories') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
