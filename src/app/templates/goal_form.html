{% extends "base.html" %}

{% block title %}{% if goal %}Edit{% else %}Add{% endif %} Goal - Personal Finance Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if goal %}Edit{% else %}Add New{% endif %} Goal</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Goal Name *</label>
                <input type="text" class="form-control" id="name" name="name" 
                       value="{{ goal.name if goal else '' }}" required>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="target_amount" class="form-label">Target Amount (EGP) *</label>
                    <input type="number" step="0.01" class="form-control" id="target_amount" 
                           name="target_amount" value="{{ goal.target_amount if goal else '' }}" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="current_amount" class="form-label">Current Amount (EGP)</label>
                    <input type="number" step="0.01" class="form-control" id="current_amount" 
                           name="current_amount" value="{{ goal.current_amount if goal else '0' }}">
                </div>
            </div>
            
            <div class="mb-3">
                <label for="target_date" class="form-label">Target Date (Optional)</label>
                <input type="date" class="form-control" id="target_date" name="target_date" 
                       value="{{ goal.target_date.strftime('%Y-%m-%d') if goal and goal.target_date else '' }}">
            </div>
            
            <div class="mb-3">
                <label for="description" class="form-label">Description (Optional)</label>
                <textarea class="form-control" id="description" name="description" rows="3">{{ goal.description if goal else '' }}</textarea>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    {% if goal %}Update{% else %}Create{% endif %} Goal
                </button>
                <a href="{{ url_for('goal.goals') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
