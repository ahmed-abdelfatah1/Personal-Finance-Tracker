{% extends "base.html" %}

{% block title %}Add Account - Personal Finance Tracker{% endblock %}

{% block content %}
<a href="{{ url_for('account.accounts') }}" class="back-link">← Back to Accounts</a>

<div class="card" style="max-width: 500px;">
    <div class="card-header">
        <h2>Add New Account</h2>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('account.add_account') }}">
            <div class="form-group">
                <label class="form-label">Account Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g., Main Checking" required>
            </div>

            <div class="form-group">
                <label class="form-label">Account Type</label>
                <select name="account_type" class="form-control">
                    <option value="">Select Type (optional)</option>
                    <option value="Checking">Checking</option>
                    <option value="Savings">Savings</option>
                    <option value="Cash">Cash</option>
                    <option value="Credit Card">Credit Card</option>
                    <option value="Investment">Investment</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Initial Balance</label>
                <input type="number" name="initial_balance" class="form-control" step="0.01" value="0.00" placeholder="0.00">
                <span class="form-text">Enter the current balance of this account</span>
            </div>

            <div class="btn-group mt-3">
                <button type="submit" class="btn btn-primary">Create Account</button>
                <a href="{{ url_for('account.accounts') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
