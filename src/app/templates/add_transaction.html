<!DOCTYPE html>
<html>
<head>
    <title>Add Transaction - Personal Finance Tracker</title>
</head>
<body>
    <h1>Add New Transaction</h1>
    
    <a href="{{ url_for('transactions') }}">← Back to Transactions</a>
    <hr>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div style="color: red">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    
    <form method="POST" action="{{ url_for('add_transaction') }}">
        <div>
            <label>Date:</label>
            <input type="date" name="date" required>
        </div>
        
        <div>
            <label>Type:</label>
            <select name="transaction_type" required>
                <option value="">Select Type</option>
                <option value="Income">Income (+)</option>
                <option value="Expense">Expense (-)</option>
            </select>
        </div>
        
        <div>
            <label>Amount:</label>
            <input type="number" name="amount" step="0.01" min="0.01" required>
        </div>
        
        <div>
            <label>Account:</label>
            <select name="account_id" required>
                <option value="">Select Account</option>
                {% for account in accounts %}
                <option value="{{ account.id }}">{{ account.name }} ({{ account.current_balance }})</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label>Category:</label>
            <select name="category_id" required>
                <option value="">Select Category</option>
                {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label>Description (optional):</label>
            <input type="text" name="description">
        </div>
        
        <button type="submit">Add Transaction</button>
        <a href="{{ url_for('transactions') }}">Cancel</a>
    </form>
</body>
</html>
