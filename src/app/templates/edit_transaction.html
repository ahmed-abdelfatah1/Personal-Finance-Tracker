{% extends "base.html" %}

{% block title %}Edit Transaction - Personal Finance Tracker{% endblock %}

{% block content %}
<a href="{{ url_for('transaction.transactions') }}" class="back-link">← Back to Transactions</a>

<div class="card" style="max-width: 600px;">
    <div class="card-header">
        <h2>Edit Transaction</h2>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('transaction.edit_transaction', transaction_id=transaction.id) }}">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control" value="{{ transaction.date.strftime('%Y-%m-%d') }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Type</label>
                    <select name="transaction_type" class="form-control" required>
                        <option value="Income" {% if transaction.transaction_type == 'Income' %}selected{% endif %}>Income (+)</option>
                        <option value="Expense" {% if transaction.transaction_type == 'Expense' %}selected{% endif %}>Expense (-)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Amount</label>
                <input type="number" name="amount" class="form-control" step="0.01" min="0.01" value="{{ transaction.amount }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Account</label>
                    <select name="account_id" class="form-control" required>
                        {% for account in accounts %}
                        <option value="{{ account.id }}" {% if account.id == transaction.account_id %}selected{% endif %}>
                            {{ account.name }} ({{ "%.2f"|format(account.current_balance) }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select name="category_id" class="form-control" required>
                        {% for category in categories %}
                        <option value="{{ category.id }}" {% if category.id == transaction.category_id %}selected{% endif %}>
                            {{ category.name }} ({{ category.category_type }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Description (optional)</label>
                <input type="text" name="description" class="form-control" value="{{ transaction.description or '' }}">
            </div>

            <div class="btn-group mt-3">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('transaction.transactions') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
