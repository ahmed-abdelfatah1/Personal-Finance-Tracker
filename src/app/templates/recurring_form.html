{% extends "base.html" %}

{% block title %}{% if recurring %}Edit{% else %}Add{% endif %} Recurring Transaction - Personal Finance Tracker{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if recurring %}Edit{% else %}Add New{% endif %} Recurring Transaction</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Name *</label>
                <input type="text" class="form-control" id="name" name="name" 
                       value="{{ recurring.name if recurring else '' }}" required>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="account_id" class="form-label">Account *</label>
                    <select class="form-select" id="account_id" name="account_id" required>
                        <option value="">Select Account</option>
                        {% for account in accounts %}
                        <option value="{{ account.id }}" 
                                {% if recurring and recurring.account_id == account.id %}selected{% endif %}>
                            {{ account.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="category_id" class="form-label">Category *</label>
                    <select class="form-select" id="category_id" name="category_id" required>
                        <option value="">Select Category</option>
                        {% for category in categories %}
                        <option value="{{ category.id }}" 
                                {% if recurring and recurring.category_id == category.id %}selected{% endif %}>
                            {{ category.name }} ({{ category.category_type }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="amount" class="form-label">Amount (EGP) *</label>
                    <input type="number" step="0.01" class="form-control" id="amount" name="amount" 
                           value="{{ recurring.amount if recurring else '' }}" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="transaction_type" class="form-label">Type *</label>
                    <select class="form-select" id="transaction_type" name="transaction_type" required>
                        <option value="Income" {% if recurring and recurring.transaction_type == 'Income' %}selected{% endif %}>Income</option>
                        <option value="Expense" {% if recurring and recurring.transaction_type == 'Expense' %}selected{% endif %}>Expense</option>
                    </select>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="frequency" class="form-label">Frequency *</label>
                <select class="form-select" id="frequency" name="frequency" required>
                    <option value="daily" {% if recurring and recurring.frequency == 'daily' %}selected{% endif %}>Daily</option>
                    <option value="weekly" {% if recurring and recurring.frequency == 'weekly' %}selected{% endif %}>Weekly</option>
                    <option value="monthly" {% if recurring and recurring.frequency == 'monthly' %}selected{% endif %}>Monthly</option>
                    <option value="yearly" {% if recurring and recurring.frequency == 'yearly' %}selected{% endif %}>Yearly</option>
                </select>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="start_date" class="form-label">Start Date *</label>
                    <input type="date" class="form-control" id="start_date" name="start_date" 
                           value="{{ recurring.start_date.strftime('%Y-%m-%d') if recurring else '' }}" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="end_date" class="form-label">End Date (Optional)</label>
                    <input type="date" class="form-control" id="end_date" name="end_date" 
                           value="{{ recurring.end_date.strftime('%Y-%m-%d') if recurring and recurring.end_date else '' }}">
                </div>
            </div>
            
            <div class="mb-3">
                <label for="description" class="form-label">Description (Optional)</label>
                <textarea class="form-control" id="description" name="description" rows="2">{{ recurring.description if recurring else '' }}</textarea>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    {% if recurring %}Update{% else %}Create{% endif %} Recurring Transaction
                </button>
                <a href="{{ url_for('recurring.recurring_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
